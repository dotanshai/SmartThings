id: smarthome4u-6gang-switch-mixed-lr-multi-v2
name: smarthome4u-6gang-switch-mixed-lr-multi-v2

components:
  - id: main
    label: Dashboard Switch
    capabilities:
      - id: switch
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Light

  - id: main02
    label: Switch 2
    capabilities:
      - id: switch
      - id: refresh
    categories:
