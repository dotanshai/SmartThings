  - id: main05
    label: Switch 5
    capabilities:
      - id: switch
    categories:
      - name: Switch

  - id: curtain1
    label: Curtain A (col 1+4)
    capabilities:
      - id: windowShade
      - id: refresh
    categories:
      - name: Blind

  - id: curtain3
    label: Curtain C (col 3+6)
    capabilities:
      - id: windowShade
    categories:
      - name: Blind

  - id: channeltype1
    label: Channel Type — Left Col (1+4)
    capabilities:
      - id: vehiclepatch55148.channelType
        version: 1
