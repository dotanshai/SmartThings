  - id: channeltype2
    label: Channel Type — Middle Col (2+5)
    capabilities:
      - id: vehiclepatch55148.channelType
        version: 1
    categories:
      - name: Switch

  - id: channeltype3
    label: Channel Type — Right Col (3+6)
    capabilities:
      - id: vehiclepatch55148.channelType
        version: 1
    categories:
