preferences:
  - name: multiTileMode
    title: Multi-Tile Dashboard
    description: "OFF = single tile with dashboard button\nON = separate tile per channel"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "off": "Off (single tile)"
        "on":  "On (all detected channels)"
      default: "off"

  - name: dashboardSwitch
    title: "Dashboard Button: which light"
    description: "The dashboard button controls this light (single and multi-tile mode)"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "main01": "Switch 1 (DP 1)"
        "main02": "Switch 2 (DP 2)"
        "main03": "Switch 3 (DP 3)"
        "main04": "Switch 4 (DP 4)"
        "all":    "All Switches"
      default: "main01"

  - name: createChildDevices
    title: Create Child Devices
    description: Create child switch devices
    required: false
    preferenceType: enumeration
    definition:
      options:
        "yes": "Yes"
        "no": "No"
      default: "no"


