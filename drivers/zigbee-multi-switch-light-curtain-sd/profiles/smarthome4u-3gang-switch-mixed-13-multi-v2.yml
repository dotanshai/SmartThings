id: smarthome4u-3gang-switch-mixed-13-multi-v2
name: smarthome4u-3gang-switch-mixed-13-multi-v2

components:
  - id: main
    label: Dashboard Switch
    capabilities:
      - id: switch
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Light

  - id: main02
    label: Switch 2
    capabilities:
      - id: switch
    categories:
      - name: Switch

  - id: curtain1
    label: Curtain (buttons 1+3)
    capabilities:
      - id: windowShade
    categories:
      - name: Blind

  - id: channeltype1
    label: "Channel Type - Buttons 1+3"
    capabilities:
      - id: vehiclepatch55148.channelType
        version: 1
    categories:
      - name: Switch

  - id: backlight
    label: Backlight Mode
    capabilities:
      - id: perfectworld33337.backlightMode
        version: 1
    categories:
      - name: Switch

  - id: childlock
    label: Child Lock Mode
    capabilities:
      - id: vehiclepatch55148.childlock
        version: 1
    categories:
      - name: Switch

  - id: signal
    label: Signal Quality
    capabilities:
      - id: perfectworld33337.signalMetrics
        version: 1
    categories:
      - name: Switch

preferences:
  - name: multiTileMode
    title: Multi-Tile Dashboard
    description: "OFF = single tile with dashboard button\nON = separate tile per channel"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "off": "Off (single tile)"
        "on":  "On (all channels)"
      default: "off"

  - name: curtainDuration1
    title: "Curtain Duration (sec)"
    description: "Curtain motor run time (10-600s, default 90)"
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 600
      default: 90

  - name: createChildDevices
    title: Create Child Devices
    description: Create child switch/curtain devices
    required: false
    preferenceType: enumeration
    definition:
      options:
        "yes": "Yes"
        "no": "No"
      default: "no"

metadata:
  mnmn: SmartThingsCommunity
  vid: 52bcfaf9-e6a8-3353-9761-40dfbd1ab810