preferences:
  - name: multiTileMode
    title: "Multi-Tile Dashboard"
    description: "OFF = single tile with dashboard button\nON = separate tile per channel"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "off": "Off (single tile)"
        "on": "On (all channels)"
      default: "off"

  - name: dashboardSwitch
    title: "Dashboard Button Controls"
    description: "Which switch the main dashboard button controls"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "switch3": "Switch 3 / Right Col"
        "switch6": "Switch 6"
        "all": "All switches (master)"
      default: "switch3"

  - name: curtainDuration1
    title: "Curtain A Duration (sec)"
    description: "Left col curtain motor run time (10-600s, default 90)"
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 600
      default: 90

  - name: curtainDuration2
    title: "Curtain B Duration (sec)"
    description: "Middle col curtain motor run time (10-600s, default 90)"
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 600
      default: 90

  - name: createChildDevices
    title: "Create Child Devices"
    description: "Create child switch/curtain devices"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "yes": "Yes"
        "no": "No"
      default: "no"

