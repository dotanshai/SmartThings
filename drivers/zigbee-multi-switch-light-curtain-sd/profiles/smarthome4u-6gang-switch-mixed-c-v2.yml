preferences:
  - name: multiTileMode
    title: Multi-Tile Dashboard
    description: "OFF = single tile with dashboard button\nON = separate tile per channel"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "off": "Off (single tile)"
        "on":  "On (all detected channels)"
      default: "off"

  - name: dashboardSwitch
    title: Dashboard Button Controls
    description: "Which switch the main dashboard button controls"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "sw1":     "Switch 1 (left col)"
        "switch2": "Switch 2 (mid col)"
        "switch3": "Switch 3 (right col)"
        "switch4": "Switch 4"
        "switch5": "Switch 5"
        "switch6": "Switch 6"
        "all":     "All switches (master)"
      default: "sw1"

  - name: curtainDuration1
    title: Curtain A Duration (seconds)
    description: "Left col curtain motor run time (10-600s, default 90)"
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 600
      default: 90

  - name: curtainDuration2
    title: Curtain B Duration (seconds)
    description: "Middle col curtain motor run time (10-600s, default 90)"
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 600
      default: 90

  - name: curtainDuration3
    title: Curtain C Duration (seconds)
    description: "Right col curtain motor run time (10-600s, default 90)"
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 600
      default: 90

  - name: createChildDevices
    title: Create Child Devices
    description: Create child switch devices
    required: false
    preferenceType: enumeration
    definition:
      options:
        "yes": "Yes"
        "no": "No"
      default: "no"

