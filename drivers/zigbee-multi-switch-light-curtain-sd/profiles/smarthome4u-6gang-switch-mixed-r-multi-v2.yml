preferences:
  - name: dashboardSwitch
    title: "Dashboard Button Controls"
    description: "Which light the main dashboard button controls"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "sw1": "Light 1"
        "switch2": "Light 2"
        "switch4": "Light 4"
        "switch5": "Light 5"
        "all": "All lights"
      default: "sw1"

  - name: multiTileMode
    title: "Multi-Tile Dashboard"
    description: "OFF = single tile with dashboard button\nON = separate tile per channel"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "off": "Off (single tile)"
        "on": "On (all channels)"
      default: "off"

  - name: curtainDuration3
    title: "Curtain C Duration (sec)"
    description: "Right col curtain motor run time (10-600s, default 90)"
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 600
      default: 90

  - name: createChildDevices
    title: "Create Child Devices"
    description: "Create child switch/curtain devices"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "yes": "Yes"
        "no": "No"
      default: "no"

