id: smarthome4u-4gang-switch-mixed-r-multi-v2
name: smarthome4u-4gang-switch-mixed-r-multi-v2

components:
  # main component — top-right dashboard switch button. Pure switch only.
  - id: main
    label: Dashboard Switch
    capabilities:
      - id: switch
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Light

  - id: main01
    label: Light 1
    capabilities:
      - id: switch
        version: 1
    categories:
      - name: Light

  - id: main03
    label: Light 3
    capabilities:
      - id: switch
        version: 1
    categories:
      - name: Light

  - id: curtain2
    label: Curtain (col 2+4)
    capabilities:
      - id: windowShade
    categories:
      - name: Blind

  - id: channeltype1
    label: "Channel Type — Left Col (1+3)"
    capabilities:
      - id: vehiclepatch55148.channelType
        version: 1
    categories:
      - name: Switch

  - id: channeltype2
    label: "Channel Type — Right Col (2+4)"
    capabilities:
      - id: vehiclepatch55148.channelType
        version: 1
    categories:
      - name: Switch

  - id: backlight
    label: Backlight Mode
    capabilities:
      - id: perfectworld33337.backlightMode
        version: 1
    categories:
      - name: Switch

  - id: childlock
    label: Child Lock Mode
    capabilities:
      - id: vehiclepatch55148.childlock
        version: 1
    categories:
      - name: Switch

  - id: signal
    label: Signal Quality
    capabilities:
      - id: perfectworld33337.signalMetrics
        version: 1
    categories:
      - name: Switch

preferences:
  - name: multiTileMode
    title: Multi-Tile Dashboard
    description: "Show curtain + light tiles separately on the dashboard"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "on": "On (curtain + light tiles)"
        "off": "Off (single tile)"
      default: "on"

  - name: dashboardSwitch
    title: "Dashboard Button: which light"
    description: "The top-right dashboard switch button controls this light (applies when in single-tile mode)"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "main01": "Light 1 (gang 1)"
        "main03": "Light 3 (gang 3)"
        "both":   "Both Lights"
      default: "main01"

  - name: curtainDuration2
    title: Curtain Duration (seconds)
    description: "How long the curtain motor runs for open/close (10-600s, default 90)"
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 600
      default: 90

  - name: createChildDevices
    title: Create Child Devices
    description: Create child switch devices
    required: false
    preferenceType: enumeration
    definition:
      options:
        "yes": "Yes"
        "no": "No"
      default: "no"

metadata:
  mnmn: SmartThingsCommunity
  vid: 4ee18d2e-5556-3d47-98cb-f8ace85ba098
