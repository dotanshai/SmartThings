preferences:
  - name: dashboardSwitch
    title: "Dashboard Button Controls"
    description: "Which light the main dashboard button controls"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "sw1": "Light 1"
        "switch2": "Light 2"
        "switch3": "Light 3"
        "switch4": "Light 4"
        "switch5": "Light 5"
        "switch6": "Light 6"
        "all": "All lights"
      default: "all"

  - name: multiTileMode
    title: Multi-Tile Dashboard
    description: "OFF = single tile with dashboard button\nON = tile per light (app shows max 4 - use Child Devices for all 6)"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "off": "Off (single tile)"
        "on":  "On (all detected channels)"
      default: "off"


  - name: createChildDevices
    title: Create Child Devices
    description: Create child switch devices
    required: false
    preferenceType: enumeration
    definition:
      options:
        "yes": "Yes"
        "no": "No"
      default: "no"

