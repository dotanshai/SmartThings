id: smarthome4u-4gang-switch-mixed-r-v2
name: smarthome4u-4gang-switch-mixed-r-v2

components:
  # main = top-right dashboard ON/OFF button, controls the dashboardSwitch selection
  - id: main
    label: Dashboard Switch
    capabilities:
      - id: switch
        version: 1
    categories:
      - name: Light

  - id: sw1
    label: Light 1
    capabilities:
      - id: switch
    categories:
      - name: Light

  - id: switch3
    label: Light 3
    capabilities:
      - id: switch
    categories:
      - name: Light

  - id: curtain2
    label: Curtain (col 2+4)
    capabilities:
      - id: windowShade
      - id: refresh
    categories:
      - name: Blind

  - id: channeltype1
    label: "Channel Type — Left Col (1+3)"
    capabilities:
      - id: vehiclepatch55148.channelType
        version: 1
    categories:
      - name: Switch

  - id: channeltype2
    label: "Channel Type — Right Col (2+4)"
    capabilities:
      - id: vehiclepatch55148.channelType
        version: 1
    categories:
      - name: Switch

  - id: backlight
    label: Backlight Mode
    capabilities:
      - id: perfectworld33337.backlightMode
        version: 1
    categories:
      - name: Switch

  - id: childlock
    label: Child Lock Mode
    capabilities:
      - id: vehiclepatch55148.childlock
        version: 1
    categories:
      - name: Switch

  - id: signal
    label: Signal Quality
    capabilities:
      - id: perfectworld33337.signalMetrics
        version: 1
    categories:
      - name: Switch

preferences:
  - name: multiTileMode
    title: Multi-Tile Dashboard
    description: "OFF = single tile with dashboard button\nON = separate tile per channel"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "off": "Off (single tile)"
        "on":  "On (all detected channels)"
      default: "off"

  - name: dashboardSwitch
    title: "Dashboard Button: which light"
    description: "The top-right dashboard button controls this light"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "sw1":     "Light 1 (left col, gang 1)"
        "switch3": "Light 3 (left col, gang 3)"
        "both":    "All Lights (Light 1 + Light 3)"
      default: "sw1"

  - name: curtainDuration2
    title: Curtain Duration (seconds)
    description: "How long the curtain motor runs for open/close (10-600s, default 90)"
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 600
      default: 90

  - name: createChildDevices
    title: Create Child Devices
    description: Create child switch devices
    required: false
    preferenceType: enumeration
    definition:
      options:
        "yes": "Yes"
        "no": "No"
      default: "no"

metadata:
  mnmn: SmartThingsCommunity
  vid: 856370d2-4599-388e-b1f9-486c57dfa693
