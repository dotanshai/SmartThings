id: smarthome4u-2gang-switch-curtain-multi-v2
name: smarthome4u-2gang-switch-curtain-multi-v2

components:
  - id: curtain1
    label: Curtain
    capabilities:
      - id: windowShade
      - id: refresh
    categories:
      - name: Blind

  - id: channeltype1
    label: "Channel Type"
    capabilities:
      - id: vehiclepatch55148.channelType
        version: 1
    categories:
      - name: Switch

  - id: backlight
    label: Backlight Mode
    capabilities:
      - id: perfectworld33337.backlightMode
        version: 1
    categories:
      - name: Switch

  - id: childlock
    label: Child Lock Mode
    capabilities:
      - id: vehiclepatch55148.childlock
        version: 1
    categories:
      - name: Switch

  - id: signal
    label: Signal Quality
    capabilities:
      - id: perfectworld33337.signalMetrics
        version: 1
    categories:
      - name: Switch

preferences:
  - name: multiTileMode
    title: Multi-Tile Dashboard
    description: "OFF = single tile with dashboard button\nON = separate tile per channel"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "off": "Off (single tile)"
        "on":  "On (all detected channels)"
      default: "off"

  - name: curtainDuration1
    title: Curtain Duration (seconds)
    description: "How long the curtain motor runs for open/close (10-600s, default 90)"
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 600
      default: 90

  - name: createChildDevices
    title: Create Child Devices
    description: Create child switch devices
    required: false
    preferenceType: enumeration
    definition:
      options:
        "yes": "Yes"
        "no": "No"
      default: "no"

metadata:
  mnmn: SmartThingsCommunity
  vid: 2645d46f-d955-30e6-8670-5a82ca77ac11
