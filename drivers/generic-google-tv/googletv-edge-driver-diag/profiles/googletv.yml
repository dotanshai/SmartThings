name: googletv.v1
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: audioVolume
        version: 1
      - id: audioMute
        version: 1
      - id: mediaPlayback
        version: 1
      - id: mediaTrackControl
        version: 1
      - id: tvChannel
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Television
metadata:
  deviceType: Television
  ocfDeviceType: oic.d.tv
preferences:
  - name: "ipAddress"
    title: "TV IP address"
    description: "Fixed/reserved LAN IP address of the Google TV, e.g. 192.168.1.50. Set this first."
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 15
      default: ""
  - name: "macAddress"
    title: "TV MAC address (for power-on)"
    description: "e.g. AA:BB:CC:DD:EE:FF. Needed to turn the TV on from fully off via Wake-on-LAN; Wake-on-LAN must also be enabled in the TV's network settings."
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 17
      default: ""
  - name: "pairingCode"
    title: "Pairing code"
    description: "Leave blank until the TV shows a 6-character code on screen (after you set the IP address above), then enter it here."
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 6
      default: ""
